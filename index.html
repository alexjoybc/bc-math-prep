<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Grade 6/7 Math Bridge Course</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --accent: #0d9488;
            --warmup-bg: #fef3c7;
            --warmup-border: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        /* Interactive Timer Widget */
        .timer-card {
            background: #1e293b;
            color: white;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.15);
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
        }

        .timer-display.warning {
            color: #f87171;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .timer-presets {
            display: flex;
            gap: 8px;
        }

        .btn-timer-preset {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-timer-preset:hover {
            background: #475569;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
        }

        .btn-timer-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-timer-action.pause {
            background: #eab308;
        }

        .btn-timer-action.reset {
            background: #64748b;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #475569;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Detailed Concept Box */
        .concept-box {
            background-color: #f0f9ff;
            border-left: 5px solid var(--primary);
            padding: 16px 20px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .concept-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--primary-dark);
            font-size: 1.15rem;
        }

        .concept-box ul {
            margin: 5px 0 10px 0;
            padding-left: 20px;
        }

        .concept-box li {
            margin-bottom: 6px;
        }

        .worked-example {
            background: #e0f2fe;
            border-radius: 6px;
            padding: 10px 14px;
            margin-top: 10px;
            font-size: 0.95rem;
            border: 1px solid #bae6fd;
        }

        .trap-warning {
            color: #b91c1c;
            font-weight: bold;
            margin-top: 6px;
            display: block;
        }

        .warmup-box {
            background-color: var(--warmup-bg);

            padding: 14px 18px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .warmup-box h4 {
            margin-top: 0;
            margin-bottom: 8px;
            color: #92400e;
            font-size: 1rem;
        }

            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .fallback-link {

            margin-top: 0;
            margin-bottom: 25px;

            font-weight: bold;
            color: var(--primary-dark);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            margin-top: 25px;
            margin-bottom: 15px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

            border: 1px solid #cbd5e1;

            background: #fafafa;

            border-radius: 4px;

            border-radius: 6px;

        }

            border: none;
            padding: 10px 18px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-toggle-answers.unlocked {
            background: #b45309;
        }

            border: 1px solid #6ee7b7;

            display: block;
        }

            color: #065f46;

        .answer-steps {

            color: #1e293b;
        }

            margin-bottom: 3px;
        }

        .answer-hint {

            margin-top: 8px;
            font-size: 0.8rem;
            color: #64748b;
            font-style: italic;
        }

        .answers-unlocked .answer-hint {

        }

            background: #f1f5f9;
            padding: 12px 15px;

        }

            padding: 10px 14px;
            border-radius: 4px;
        }

        .tip-box {
            background: #ecfdf5;
            border: 1px solid #6ee7b7;
            border-radius: 6px;
            padding: 14px 18px;
            margin-bottom: 10px;

            display: grid;

            border-radius: 6px;

            border: none;

            border-radius: 6px;

            .day-card { box-shadow: none; padding: 0; }

            .warmup-box { padding: 8px 12px; margin-bottom: 10px; }
            .grid-2col { gap: 8px; margin-bottom: 10px; }
            .problem-card { padding: 6px 10px; }
            .work-box { height: 40px; }
            .answer-reveal, .answer-hint { display: none !important; }
        }
    </style>
</head>

<script>
const PARENT_PASSCODE = "parent123";

// Timer Variables & Logic
let timerSeconds = 300;
let initialSeconds = 300;
let timerInterval = null;
let isTimerRunning = false;

function updateTimerDisplay() {
    const mins = Math.floor(timerSeconds / 60);
    const secs = timerSeconds % 60;
    const display = document.getElementById('timer-display');
    display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

    if (timerSeconds <= 60 && timerSeconds > 0) {
        display.classList.add('warning');
    } else {
        display.classList.remove('warning');
    }
}

function setTimer(minutes) {
    pauseTimer();
    timerSeconds = minutes * 60;
    initialSeconds = timerSeconds;
    updateTimerDisplay();
}

function toggleTimer() {
    if (isTimerRunning) {
        pauseTimer();
    } else {
        startTimer();
    }
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    isTimerRunning = true;
    document.getElementById('timer-toggle-btn').textContent = 'Pause';
    document.getElementById('timer-toggle-btn').classList.add('pause');

    timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
        } else {
            pauseTimer();
            playChime();
            alert("⏰ Time is up for this section!");
        }
    }, 1000);
}

function pauseTimer() {
    isTimerRunning = false;
    clearInterval(timerInterval);
    const btn = document.getElementById('timer-toggle-btn');
    if (btn) {
        btn.textContent = 'Start';
        btn.classList.remove('pause');
    }
}

function resetTimer() {
    pauseTimer();
    timerSeconds = initialSeconds;
    updateTimerDisplay();
}

function playChime() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 587.33; // D5 note
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
    } catch(e) {
        // Audio fallback
    }
}

// --- Parent Answer Unlock (persists across day tabs for the session) ---
let answersUnlocked = sessionStorage.getItem('answersUnlocked') === 'true';

function toggleAnswers() {
    if (!answersUnlocked) {
        const input = prompt("Enter Parent Passcode to reveal step-by-step answers:");
        if (input === null) return;
        if (input !== PARENT_PASSCODE) {
            alert("Incorrect passcode! Peeking is not allowed 😉");
            return;
        }
        answersUnlocked = true;
    } else {
        answersUnlocked = false;
    }
    sessionStorage.setItem('answersUnlocked', answersUnlocked);
    applyAnswerState();
}

function applyAnswerState() {
    const contentArea = document.getElementById('content-area');
    const btn = document.getElementById('toggle-answers-btn');
    if (contentArea) {
        contentArea.classList.toggle('answers-unlocked', answersUnlocked);
    }
    if (btn) {
        btn.textContent = answersUnlocked ? '🔓 Hide Parent Answers' : '🔒 Unlock Parent Answers';
        btn.classList.toggle('unlocked', answersUnlocked);
    }
}

function renderAnswerReveal(finalAnswer, steps) {
    return `
        <div class="answer-reveal">
            <div class="answer-final">✅ Answer: ${finalAnswer}</div>
            <ol class="answer-steps">
                ${steps.map(s => `<li>${s}</li>`).join('')}
            </ol>
        </div>
        <span class="answer-hint">🔒 Ask a parent to unlock step-by-step solutions</span>
    `;
}
