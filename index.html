<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Grade 6/7 Math Bridge Course</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --accent: #0d9488;
            --warmup-bg: #fef3c7;
            --warmup-border: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        /* Interactive Timer Widget */
        .timer-card {
            background: #1e293b;
            color: white;
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.15);
        }

        .timer-display {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.2rem;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 2px;
        }

        .timer-display.warning {
            color: #f87171;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .timer-presets {
            display: flex;
            gap: 8px;
        }

        .btn-timer-preset {
            background: #334155;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .btn-timer-preset:hover {
            background: #475569;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
        }

        .btn-timer-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-timer-action.pause {
            background: #eab308;
        }

        .btn-timer-action.reset {
            background: #64748b;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #475569;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Concept Box */
        .concept-box {
            background-color: #f0f9ff;
            border-left: 5px solid var(--primary);
            padding: 14px 18px;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .concept-box h3 {
            margin-top: 0;
            margin-bottom: 6px;
            color: var(--primary-dark);
            font-size: 1.1rem;
        }

        .warmup-box {
            background-color: var(--warmup-bg);
            border: 1px solid var(--warmup-border);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .warmup-box h4 {
            margin-top: 0;
            margin-bottom: 6px;
            color: #92400e;
        }

        /* Video Container */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .fallback-link {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 0;
            margin-bottom: 25px;
        }

        .fallback-link a {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .section-header {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--primary-dark);
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 5px;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .problem-card {
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fafafa;
        }

        .problem-card strong {
            font-size: 0.95rem;
        }

        .work-box {
            height: 45px;
            border: 1px dashed #94a3b8;
            margin-top: 6px;
            border-radius: 4px;
            background: white;
        }

        .btn-print {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Answer Lock Styling */
        .parent-key-container {
            margin-top: 30px;
            background: #f1f5f9;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
        }

        .btn-unlock {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .answer-content {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: white;
            border-radius: 4px;
            border-left: 4px solid var(--accent);
        }

        /* Print Formatting Rules */
        @media print {
            body { background: white; padding: 0; font-size: 11pt; }
            .container { max-width: 100%; }
            .nav-tabs, .video-container, .fallback-link, .btn-print, .timer-card, .parent-key-container, header p { display: none; }
            .day-card { box-shadow: none; padding: 0; }
            .concept-box { padding: 8px 12px; margin-bottom: 10px; }
            .warmup-box { padding: 8px 12px; margin-bottom: 10px; }
            .grid-2col { gap: 8px; margin-bottom: 10px; }
            .problem-card { padding: 6px 10px; }
            .work-box { height: 50px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BC Grade 6/7 Math Bridge Course</h1>
        <p>Daily 35-Min Structure: 5-min Concept/Warm-Up ➔ 10-min Video ➔ 20-min Worksheet</p>
    </header>

    <!-- Interactive Class Timer -->
    <div class="timer-card">
        <div>
            <div style="font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; font-weight: bold;">Lesson Timer</div>
            <div id="timer-display" class="timer-display">05:00</div>
        </div>
        <div class="timer-presets">
            <button class="btn-timer-preset" onclick="setTimer(5)">⏱️ 5M Review</button>
            <button class="btn-timer-preset" onclick="setTimer(10)">🎥 10M Video</button>
            <button class="btn-timer-preset" onclick="setTimer(20)">📝 20M Work</button>
        </div>
        <div class="timer-controls">
            <button id="timer-toggle-btn" class="btn-timer-action" onclick="toggleTimer()">Start</button>
            <button class="btn-timer-action reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="loadDay(1)">Day 1: Decimals</button>
        <button class="tab-btn" onclick="loadDay(2)">Day 2: BEDMAS</button>
        <button class="tab-btn" onclick="loadDay(3)">Day 3: Factors & Rules</button>
        <button class="tab-btn" onclick="loadDay(4)">Day 4: Fractions</button>
        <button class="tab-btn" onclick="loadDay(5)">Day 5: Ratios & %</button>
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ Print Today's Worksheet</button>

    <div id="content-area" class="day-card">
        <!-- Content injects dynamically -->
    </div>
</div>

<script>
const PARENT_PASSCODE = "parent123";

// Timer Variables & Logic
let timerSeconds = 300;
let initialSeconds = 300;
let timerInterval = null;
let isTimerRunning = false;

function updateTimerDisplay() {
    const mins = Math.floor(timerSeconds / 60);
    const secs = timerSeconds % 60;
    const display = document.getElementById('timer-display');
    display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    
    if (timerSeconds <= 60 && timerSeconds > 0) {
        display.classList.add('warning');
    } else {
        display.classList.remove('warning');
    }
}

function setTimer(minutes) {
    pauseTimer();
    timerSeconds = minutes * 60;
    initialSeconds = timerSeconds;
    updateTimerDisplay();
}

function toggleTimer() {
    if (isTimerRunning) {
        pauseTimer();
    } else {
        startTimer();
    }
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    isTimerRunning = true;
    document.getElementById('timer-toggle-btn').textContent = 'Pause';
    document.getElementById('timer-toggle-btn').classList.add('pause');

    timerInterval = setInterval(() => {
        if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
        } else {
            pauseTimer();
            playChime();
            alert("⏰ Time is up for this section!");
        }
    }, 1000);
}

function pauseTimer() {
    isTimerRunning = false;
    clearInterval(timerInterval);
    const btn = document.getElementById('timer-toggle-btn');
    if (btn) {
        btn.textContent = 'Start';
        btn.classList.remove('pause');
    }
}

function resetTimer() {
    pauseTimer();
    timerSeconds = initialSeconds;
    updateTimerDisplay();
}

function playChime() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 587.33; // D5 note
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.8);
    } catch(e) {
        // Audio fallback if browser blocks auto audio
    }
}

        ],

        answers: "A) 1/2 | B) 25%<br><br><strong>Worksheet Solutions:</strong><br>1) 2 : 3 | 2) 0.6 and 60% | 3) 40 | 4) $6.00 | 5) 9/20 | 6) x = 10 | 7) $25.00 | 8) 75% | Word Problem: Discount = $16, Final Price = $64."

};

function loadDay(dayNum) {
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === (dayNum - 1));
    });

    const day = daysData[dayNum];
    let html = `
        <h2>${day.title}</h2>
        
        <div class="section-header">Step 1: 5-Minute Concept Review & Revision Check</div>
        <div class="concept-box">
            <h3>📖 Essential Concept</h3>
            <p>${day.concept}</p>
        </div>

        <div class="warmup-box">
            <h4>🧠 Revision Warm-Up Check (Mental Math / Discussion)</h4>
            <p>${day.warmup}</p>
        </div>

        <div class="section-header">Step 2: 10-Minute Video Lesson</div>
        <div class="video-container">
            <iframe src="https://www.youtube-nocookie.com/embed/${day.videoId}" title="Lesson Video" allowfullscreen></iframe>
        </div>
        <p class="fallback-link">
            <a href="https://www.youtube.com/watch?v=${day.videoId}" target="_blank" rel="noopener">
                📺 Having trouble playing? Click here to watch directly on YouTube
            </a>
        </p>

        <div class="section-header">Step 3: 20-Minute Printable Worksheet</div>
        <div class="grid-2col">
            ${day.problems.map(p => `
                <div class="problem-card">
                    <strong>${p}</strong>
                    <div class="work-box"></div>
                </div>
            `).join('')}
        </div>

        <div class="problem-card" style="margin-bottom: 20px;">
            <strong>Real-World Word Problem:</strong>
            <p>${day.wordProblem}</p>
            <div class="work-box" style="height: 65px;"></div>
        </div>

        <div class="parent-key-container">
            <strong>🔒 Parent Answer Key (Passcode Protected)</strong><br>
            <small>Enter passcode to unlock solutions for today's lesson.</small><br><br>
            <button class="btn-unlock" onclick="unlockAnswers()">Unlock Solutions</button>
            <div id="answer-display" class="answer-content">
                ${day.answers}
            </div>
        </div>
    `;

    document.getElementById('content-area').innerHTML = html;
}

function unlockAnswers() {
    const input = prompt("Enter Parent Passcode:");
    if (input === PARENT_PASSCODE) {
        document.getElementById('answer-display').style.display = 'block';
    } else if (input !== null) {
        alert("Incorrect passcode! Peeking is not allowed 😉");
    }
}

loadDay(1);
</script>

</body>
</html>
