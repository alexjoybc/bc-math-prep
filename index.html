<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BC Grade 6/7 Math Bridge Course</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --accent: #0d9488;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.4;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--primary-dark);
            margin-bottom: 5px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            color: #475569;
            white-space: nowrap;
        }

        .tab-btn.active {
            background-color: var(--primary);
            color: white;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Top Revision Box */
        .revision-box {
            background-color: #f0f9ff;
            border-left: 5px solid var(--primary);
            padding: 12px 18px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .revision-box h3 {
            margin-top: 0;
            margin-bottom: 4px;
            color: var(--primary-dark);
            font-size: 1.05rem;
        }

        /* Video Container */
        .video-container {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 ratio */
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 8px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .fallback-link {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .fallback-link a {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .problem-card {
            border: 1px solid #cbd5e1;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fafafa;
        }

        .problem-card strong {
            font-size: 0.95rem;
        }

        .work-box {
            height: 45px;
            border: 1px dashed #94a3b8;
            margin-top: 6px;
            border-radius: 4px;
            background: white;
        }

        .btn-print {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 20px;
            font-weight: bold;
        }

        details {
            margin-top: 20px;
            background: #f1f5f9;
            padding: 10px 15px;
            border-radius: 6px;
        }

        summary {
            font-weight: bold;
            cursor: pointer;
            color: var(--primary-dark);
        }

        /* Print Formatting Rules */
        @media print {
            body { background: white; padding: 0; font-size: 11pt; }
            .container { max-width: 100%; }
            .nav-tabs, .video-container, .fallback-link, .btn-print, header p { display: none; }
            .day-card { box-shadow: none; padding: 0; }
            .revision-box { padding: 8px 12px; margin-bottom: 12px; }
            .grid-2col { gap: 8px; margin-bottom: 10px; }
            .problem-card { padding: 6px 10px; }
            .work-box { height: 50px; }
            details { display: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BC Grade 6/7 Math Bridge</h1>
        <p>30-Minute Daily Prep Lessons & Printables</p>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="loadDay(1)">Day 1: Decimals</button>
        <button class="tab-btn" onclick="loadDay(2)">Day 2: BEDMAS</button>
        <button class="tab-btn" onclick="loadDay(3)">Day 3: Factors & Rules</button>
        <button class="tab-btn" onclick="loadDay(4)">Day 4: Fractions</button>
        <button class="tab-btn" onclick="loadDay(5)">Day 5: Ratios & %</button>
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ Print Today's Worksheet</button>

    <div id="content-area" class="day-card">
        <!-- Content injects dynamically -->
    </div>
</div>

<script>
const daysData = {
    1: {
        title: "Day 1: Operations with Decimals",
        revision: "<strong>Line up the dots!</strong> For addition/subtraction, line up decimals vertically. For multiplication, multiply as whole numbers first, then count total decimal places in factors to set your decimal point.",
        videoId: "3H9DYeR5Wmg", // Math Antics: Decimal Arithmetic
        problems: [
            "1. Solve: 14.38 + 9.625",
            "2. Solve: 30.5 - 12.84",
            "3. Multiply: 4.2 × 0.85",
            "4. Multiply: 12.4 × 3.1",
            "5. Solve: 100 - 43.67",
            "6. Multiply: 6.75 × 0.04",
            "7. Solve: 8.91 + 14.09 - 6.25",
            "8. Multiply: 0.15 × 0.8"
        ],
        wordProblem: "Maya buys 3 notebooks at $3.45 each and pens for $4.80 in Victoria. If she pays with a $20 bill, how much change does she get?",
        answers: "1) 24.005 | 2) 17.66 | 3) 3.57 | 4) 38.44 | 5) 56.33 | 6) 0.27 | 7) 16.75 | 8) 0.12 | Word Problem: $4.85 change (Total spent: $15.15)."
    },
    2: {
        title: "Day 2: Order of Operations (BEDMAS)",
        revision: "<strong>BEDMAS Rules:</strong> Brackets → Exponents → Division & Multiplication (left to right) → Addition & Subtraction (left to right).",
        videoId: "dAgfnK528RA", // Math Antics: Order of Operations
        problems: [
            "1. Evaluate: 18 + 6 ÷ 2 - 4",
            "2. Evaluate: (12 - 4) × 5 + 3",
            "3. Evaluate: 45 ÷ (3 + 6) × 2",
            "4. Evaluate: 7 × 4 - 18 ÷ 3",
            "5. Evaluate: 50 - (4 + 2) × 6",
            "6. Evaluate: 100 - 5 × 4 + 8 ÷ 2",
            "7. Evaluate: (8 + 4) ÷ (10 - 6)",
            "8. Error Check: 10 + 5 × 2 = ?"
        ],
        wordProblem: "Liam bought 4 boxes of granola bars with 6 in each. He ate 3 and gave 5 to friends. Write a bracket expression and calculate remaining bars.",
        answers: "1) 17 | 2) 43 | 3) 10 | 4) 22 | 5) 14 | 6) 84 | 7) 3 | 8) Correct answer is 20 (multiplication first!) | Word Problem: (4 × 6) - 3 - 5 = 16 bars."
    },
    3: {
        title: "Day 3: Factors, Multiples & Divisibility",
        revision: "<strong>GCF vs LCM:</strong> GCF is the largest factor that divides two numbers. LCM is the smallest shared multiple. <strong>Rule of 3:</strong> Divisible by 3 if sum of digits is divisible by 3.",
        videoId: "tE85eIZ39c0", // Math Antics: Factors and Prime Factorization (Verified Embed Enabled)
        // Alternative verified embed: "0Nv_x3n6T8M" (Math Antics: GCF)
        problems: [
            "1. Prime Factorization of 36",
            "2. Is 4,251 divisible by 3, 6, or 9?",
            "3. Find GCF of 24 and 36",
            "4. Find LCM of 8 and 12",
            "5. Find GCF of 18 and 45",
            "6. Find LCM of 6 and 9",
            "7. List all factors of 48",
            "8. Find first 3 common multiples of 4 & 6"
        ],
        wordProblem: "Sausages come in packs of 10 and buns in packs of 8. What is the fewest packs of each you need to buy to have equal amounts?",
        answers: "1) 2 × 2 × 3 × 3 | 2) Divisible by 3 only | 3) GCF = 12 | 4) LCM = 24 | 5) GCF = 9 | 6) LCM = 18 | 7) 1, 2, 3, 4, 6, 8, 12, 16, 24, 48 | 8) 12, 24, 36 | Word Problem: 4 packs sausages (40), 5 packs buns (40)."
    },
    4: {
        title: "Day 4: Fractions & Mixed Numbers",
        revision: "<strong>Adding Fractions:</strong> Find the LCM to make matching denominators before adding numerators. Convert mixed numbers (2 1/3 = 7/3) when needed.",
        videoId: "N-Y0K96Xy4", // Adding Fractions with Unlike Denominators
        problems: [
            "1. Convert 17/5 to mixed number",
            "2. Convert 3 5/8 to improper fraction",
            "3. Solve: 3/4 + 2/5",
            "4. Solve: 7/8 - 1/3",
            "5. Solve: 2 1/3 + 1 3/4",
            "6. Solve: 4 1/2 - 2 2/3",
            "7. Simplify: 18/24 to lowest terms",
            "8. Solve: 5/6 - 1/4 + 1/2"
        ],
        wordProblem: "A Kelowna crisp recipe needs 1 3/4 cups flour and 2 2/3 cups oats. How many total cups of dry ingredients are needed?",
        answers: "1) 3 2/5 | 2) 29/8 | 3) 1 3/20 | 4) 13/24 | 5) 4 1/12 | 6) 1 5/6 | 7) 3/4 | 8) 1 1/12 | Word Problem: 4 5/12 cups."
    },
    5: {
        title: "Day 5: Ratios & Percentages",
        revision: "<strong>Percent = Out of 100:</strong> To find percent of a number, convert percent to decimal and multiply (20% of 80 = 0.20 × 80 = 16).",
        videoId: "Uf-Rl1e2I4Q", // Ratios and Proportions
        problems: [
            "1. Simplify Ratio: 12 : 18",
            "2. Convert 3/5 to decimal and percent",
            "3. Find 25% of 160",
            "4. Find 15% of $40.00",
            "5. Convert 0.45 to simplified fraction",
            "6. Find missing x: 2/5 = x/25",
            "7. Find 10% of $250.00",
            "8. Express 15 out of 20 as a percent"
        ],
        wordProblem: "A jacket in Vancouver costs $80 and is 20% off. Find the discount amount and the final sale price before tax.",
        answers: "1) 2 : 3 | 2) 0.6 and 60% | 3) 40 | 4) $6.00 | 5) 9/20 | 6) x = 10 | 7) $25.00 | 8) 75% | Word Problem: Discount = $16, Final Price = $64."
    }
};

function loadDay(dayNum) {
    document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === (dayNum - 1));
    });

    const day = daysData[dayNum];
    let html = `
        <h2>${day.title}</h2>
        <div class="revision-box">
            <h3>📝 Quick Revision Box</h3>
            <p>${day.revision}</p>
        </div>

        <div class="video-container">
            <iframe src="https://www.youtube-nocookie.com/embed/${day.videoId}" title="Lesson Video" allowfullscreen></iframe>
        </div>
        <p class="fallback-link">
            <a href="https://www.youtube.com/watch?v=${day.videoId}" target="_blank" rel="noopener">
                📺 Having trouble playing? Click here to watch directly on YouTube
            </a>
        </p>

        <h3>Practice Worksheet (8 Problems)</h3>
        <div class="grid-2col">
            ${day.problems.map(p => `
                <div class="problem-card">
                    <strong>${p}</strong>
                    <div class="work-box"></div>
                </div>
            `).join('')}
        </div>

        <div class="problem-card" style="margin-bottom: 20px;">
            <strong>Real-World Word Problem:</strong>
            <p>${day.wordProblem}</p>
            <div class="work-box" style="height: 65px;"></div>
        </div>

        <details>
            <summary>Click to view Parent Answer Key</summary>
            <p style="margin-top: 10px; color: #334155; line-height: 1.6;">${day.answers}</p>
        </details>
    `;

    document.getElementById('content-area').innerHTML = html;
}

loadDay(1);
</script>

</body>
</html>
